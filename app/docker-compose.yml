services:
  api:
    build: .
    command: node src/server.js
    ports:
      - "8099:8099"
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - xxqg-data:/data
    restart: unless-stopped
    # 健康检查：进程活着不等于接口能用（DB 打不开、事件循环卡死都会 Up 但不可用）
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8099/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 执行器单独跑：崩了不影响接口，也方便加机器横向扩
  worker:
    build: .
    command: node src/worker.js
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - xxqg-data:/data
    shm_size: "1gb"
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      replicas: 1

volumes:
  xxqg-data:

